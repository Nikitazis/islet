name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          # The checks don't start Electron, so skip its 100 MB download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run check
      - run: npm test
